<div class="form-grid">
  {% for field in form %}
    <div class="field{% if field.errors %} field-error{% endif %}{% if field.name == 'reason' or field.name == 'comments' or field.name == 'correction_justification' %} field-full{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
      {{ field }}
      {% if field.help_text %}<small class="field-hint">{{ field.help_text }}</small>{% endif %}
      {% for error in field.errors %}<small class="field-error-text">{{ error }}</small>{% endfor %}
    </div>
  {% endfor %}
</div>
{% if form.non_field_errors %}<div class="form-alert" role="alert">{{ form.non_field_errors }}</div>{% endif %}
